<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="At sellout 95 percent of the ETH goes into the pool and 5 percent to the platform"><title>At sellout 95 percent of the ETH goes into the pool and 5 percent to the platform</title><rect width="900" height="230" rx="12" fill="#1f1f1f"/><defs><marker id="ah989890" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#989890"/></marker><marker id="ah7ed760" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7ed760"/></marker><marker id="ahf6543d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f6543d"/></marker><marker id="ah5fbef5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5fbef5"/></marker></defs><text x="40" y="34" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#d6d6d0" text-anchor="start" font-weight="700">Where the ETH goes at sellout</text><rect x="40" y="60" width="200" height="80" rx="10" fill="#262626" stroke="#7ed760" stroke-width="1.5"/><text x="140" y="95" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#7ed760" text-anchor="middle" font-weight="700">ETH raised</text><text x="140" y="118" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#989890" text-anchor="middle" font-weight="400">100%</text><path d="M240,85 C300,85 300,75 360,75" stroke="#5fbef5" stroke-width="2" fill="none" marker-end="url(#ah5fbef5)"/><path d="M240,115 C300,115 300,165 360,165" stroke="#989890" stroke-width="2" fill="none" marker-end="url(#ah989890)"/><rect x="360" y="45" width="500" height="60" rx="10" fill="#1d2a33" stroke="#5fbef5" stroke-width="1.5"/><text x="380" y="72" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="14" fill="#5fbef5" text-anchor="start" font-weight="700">95% into the Uniswap pool</text><text x="380" y="92" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#989890" text-anchor="start" font-weight="400">paired with the reserve tokens, LP tokens sent to a dead address</text><rect x="360" y="135" width="500" height="60" rx="10" fill="#262626" stroke="#363636" stroke-width="1.5"/><text x="380" y="162" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="14" fill="#d6d6d0" text-anchor="start" font-weight="700">5% platform fee</text><text x="380" y="182" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#989890" text-anchor="start" font-weight="400">the launcher gets no ETH</text></svg>