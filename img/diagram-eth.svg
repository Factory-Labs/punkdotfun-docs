<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="At sellout, price differences go back to buyers first. Of what the sale keeps, 95 percent goes into the pool and 5 percent to the platform."><title>At sellout, price differences go back to buyers first. Of what the sale keeps, 95 percent goes into the pool and 5 percent to the platform.</title><rect width="900" height="300" rx="12" fill="#1f1f1f"/><defs><marker id="ah989890" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#989890"/></marker><marker id="ah7ed760" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7ed760"/></marker><marker id="ah5fbef5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5fbef5"/></marker><marker id="ahec9f30" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ec9f30"/></marker></defs><text x="40" y="34" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#d6d6d0" text-anchor="start" font-weight="700">Where the ETH goes at sellout</text><rect x="40" y="70" width="190" height="90" rx="10" fill="#262626" stroke="#7ed760" stroke-width="1.5"/><text x="135" y="108" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#7ed760" text-anchor="middle" font-weight="700">ETH paid</text><text x="135" y="130" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#989890" text-anchor="middle" font-weight="400">by all buyers</text><path d="M230,95 C265.0,95 265.0,75 300,75" stroke="#ec9f30" stroke-width="2" fill="none" marker-end="url(#ahec9f30)"/><path d="M230,135 C265.0,135 265.0,185 300,185" stroke="#7ed760" stroke-width="2" fill="none" marker-end="url(#ah7ed760)"/><rect x="300" y="45" width="560" height="60" rx="10" fill="#2f2617" stroke="#ec9f30" stroke-width="1.5"/><text x="320" y="72" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="14" fill="#ec9f30" text-anchor="start" font-weight="700">Price differences back to buyers</text><text x="320" y="92" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#989890" text-anchor="start" font-weight="400">only with decay; collected after sellout</text><rect x="300" y="155" width="190" height="60" rx="10" fill="#262626" stroke="#7ed760" stroke-width="1.5"/><text x="395" y="182" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#7ed760" text-anchor="middle" font-weight="700">What the sale keeps</text><text x="395" y="201" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#989890" text-anchor="middle" font-weight="400">100%</text><path d="M490,170 C515.0,170 515.0,148 540,148" stroke="#5fbef5" stroke-width="2" fill="none" marker-end="url(#ah5fbef5)"/><path d="M490,200 C515.0,200 515.0,240 540,240" stroke="#989890" stroke-width="2" fill="none" marker-end="url(#ah989890)"/><rect x="540" y="120" width="320" height="56" rx="10" fill="#1d2a33" stroke="#5fbef5" stroke-width="1.5"/><text x="556" y="145" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="13" fill="#5fbef5" text-anchor="start" font-weight="700">95% into the Uniswap pool</text><text x="556" y="164" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#989890" text-anchor="start" font-weight="400">LP tokens sent to a dead address</text><rect x="540" y="212" width="320" height="56" rx="10" fill="#262626" stroke="#363636" stroke-width="1.5"/><text x="556" y="237" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="13" fill="#d6d6d0" text-anchor="start" font-weight="700">5% platform fee</text><text x="556" y="256" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#989890" text-anchor="start" font-weight="400">the launcher gets no ETH</text></svg>