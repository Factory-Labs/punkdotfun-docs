<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="If a sale sells out you claim your tokens and, if you paid above your batch final price, collect ETH back in a separate transaction. If it misses its deadline you withdraw a full refund instead. Never both."><title>If a sale sells out you claim your tokens and, if you paid above your batch final price, collect ETH back in a separate transaction. If it misses its deadline you withdraw a full refund instead. Never both.</title><rect width="900" height="330" rx="12" fill="#1f1f1f"/><defs><marker id="ah989890" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#989890"/></marker><marker id="ah7ed760" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7ed760"/></marker><marker id="ah5fbef5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5fbef5"/></marker><marker id="ahec9f30" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ec9f30"/></marker><marker id="ahf6543d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f6543d"/></marker></defs><text x="40" y="34" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#d6d6d0" text-anchor="start" font-weight="700">What you can collect when a sale ends</text><rect x="40" y="130" width="170" height="70" rx="10" fill="#262626" stroke="#989890" stroke-width="1.5"/><text x="125" y="160" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="14" fill="#d6d6d0" text-anchor="middle" font-weight="700">Your buys</text><text x="125" y="182" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#989890" text-anchor="middle" font-weight="400">in the sale</text><path d="M210,150 C240.0,150 240.0,95 270,95" stroke="#7ed760" stroke-width="2" fill="none" marker-end="url(#ah7ed760)"/><path d="M210,180 C240.0,180 240.0,255 270,255" stroke="#f6543d" stroke-width="2" fill="none" marker-end="url(#ahf6543d)"/><rect x="270" y="60" width="170" height="70" rx="10" fill="#22301d" stroke="#7ed760" stroke-width="1.5"/><text x="355" y="90" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="14" fill="#7ed760" text-anchor="middle" font-weight="700">Sells out</text><text x="355" y="112" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#989890" text-anchor="middle" font-weight="400">pool opens</text><rect x="270" y="220" width="170" height="70" rx="10" fill="#331f1c" stroke="#f6543d" stroke-width="1.5"/><text x="355" y="250" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="14" fill="#f6543d" text-anchor="middle" font-weight="700">Deadline passes</text><text x="355" y="272" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#989890" text-anchor="middle" font-weight="400">unsold</text><path d="M440,80 C470.0,80 470.0,62 500,62" stroke="#7ed760" stroke-width="2" fill="none" marker-end="url(#ah7ed760)"/><path d="M440,112 C470.0,112 470.0,130 500,130" stroke="#ec9f30" stroke-width="2" fill="none" marker-end="url(#ahec9f30)"/><path d="M440,255 C470.0,255 470.0,255 500,255" stroke="#f6543d" stroke-width="2" fill="none" marker-end="url(#ahf6543d)"/><rect x="500" y="30" width="360" height="60" rx="10" fill="#262626" stroke="#7ed760" stroke-width="1.5"/><text x="516" y="56" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="13" fill="#7ed760" text-anchor="start" font-weight="700">1. Claim your tokens</text><text x="516" y="76" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#989890" text-anchor="start" font-weight="400">everyone who bought; one transaction</text><rect x="500" y="100" width="360" height="60" rx="10" fill="#2f2617" stroke="#ec9f30" stroke-width="1.5"/><text x="516" y="126" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="13" fill="#ec9f30" text-anchor="start" font-weight="700">2. Collect ETH back</text><text x="516" y="146" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#989890" text-anchor="start" font-weight="400">only if you paid above your batch's final price</text><rect x="500" y="225" width="360" height="60" rx="10" fill="#331f1c" stroke="#f6543d" stroke-width="1.5"/><text x="516" y="251" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="13" fill="#f6543d" text-anchor="start" font-weight="700">Withdraw a full refund</text><text x="516" y="271" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#989890" text-anchor="start" font-weight="400">exactly what you paid; no tokens</text><text x="500" y="184" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#989890" text-anchor="start" font-weight="400">Separate transactions, no deadline.</text><text x="500" y="200" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#989890" text-anchor="start" font-weight="400">You never get both a refund and ETH back.</text></svg>