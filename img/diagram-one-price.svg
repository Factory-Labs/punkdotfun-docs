<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Ana, Ben and Cat buy at 10, 8 and 6 gwei as the price decays. The batch sells out at 6 gwei, so all three pay 6 and Ana and Ben get the difference back in ETH."><title>Ana, Ben and Cat buy at 10, 8 and 6 gwei as the price decays. The batch sells out at 6 gwei, so all three pay 6 and Ana and Ben get the difference back in ETH.</title><rect width="900" height="340" rx="12" fill="#1f1f1f"/><defs><marker id="ah989890" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#989890"/></marker><marker id="ah7ed760" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7ed760"/></marker><marker id="ah5fbef5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5fbef5"/></marker><marker id="ahec9f30" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ec9f30"/></marker></defs><text x="40" y="32" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#d6d6d0" text-anchor="start" font-weight="700">One batch, three buyers, one final price</text><line x1="80" y1="280" x2="640" y2="280" stroke="#363636"/><line x1="80" y1="60" x2="80" y2="280" stroke="#363636"/><text x="70" y="100.66666666666666" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#989890" text-anchor="end" font-weight="400">10</text><text x="70" y="137.33333333333334" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#989890" text-anchor="end" font-weight="400">8</text><text x="70" y="174.0" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#989890" text-anchor="end" font-weight="400">6</text><text x="70" y="52" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#989890" text-anchor="end" font-weight="400">gwei</text><line x1="80" y1="96.66666666666666" x2="580" y2="170.0" stroke="#7ed760" stroke-width="3"/><line x1="80" y1="170.0" x2="640" y2="170.0" stroke="#ff4fd8" stroke-width="2" stroke-dasharray="6 5"/><text x="200" y="220.0" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#ff4fd8" text-anchor="start" font-weight="700">final price: 6 gwei</text><circle cx="88" cy="97.84" r="6" fill="#5fbef5"/><text x="98" y="87.84" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#5fbef5" text-anchor="start" font-weight="400">Ana buys at 10</text><line x1="88" y1="105.84" x2="88" y2="166.0" stroke="#ec9f30" stroke-width="2" marker-end="url(#ahec9f30)"/><text x="96" y="137.92000000000002" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#ec9f30" text-anchor="start" font-weight="400">4 back</text><circle cx="330.0" cy="133.33333333333334" r="6" fill="#5fbef5"/><text x="340.0" y="123.33333333333334" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#5fbef5" text-anchor="start" font-weight="400">Ben buys at 8</text><line x1="330.0" y1="141.33333333333334" x2="330.0" y2="166.0" stroke="#ec9f30" stroke-width="2" marker-end="url(#ahec9f30)"/><text x="338.0" y="155.66666666666669" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#ec9f30" text-anchor="start" font-weight="400">2 back</text><circle cx="580" cy="170.0" r="6" fill="#5fbef5"/><text x="590" y="194" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#5fbef5" text-anchor="end" font-weight="400">Cat buys at 6 and sells out the batch</text><rect x="670" y="60" width="200" height="220" rx="10" fill="#262626" stroke="#363636" stroke-width="1.5"/><text x="686" y="90" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="13" fill="#d6d6d0" text-anchor="start" font-weight="700">Everyone pays 6</text><text x="686" y="116" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#989890" text-anchor="start" font-weight="400">Tokens stay as bought.</text><text x="686" y="140" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#ec9f30" text-anchor="start" font-weight="400">Ana gets 4 gwei</text><text x="686" y="156" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#ec9f30" text-anchor="start" font-weight="400">per token back</text><text x="686" y="180" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#ec9f30" text-anchor="start" font-weight="400">Ben gets 2 gwei</text><text x="686" y="196" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#ec9f30" text-anchor="start" font-weight="400">per token back</text><text x="686" y="220" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#989890" text-anchor="start" font-weight="400">Cat gets nothing</text><text x="686" y="236" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#989890" text-anchor="start" font-weight="400">back</text><text x="686" y="264" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#989890" text-anchor="start" font-weight="400">Collected after sellout</text></svg>