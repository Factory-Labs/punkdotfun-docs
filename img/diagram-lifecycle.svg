<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 205" width="980" height="205" role="img" aria-label="The life of a launch: create, fund, auction, then either sell out or refund"><title>The life of a launch: create, fund, auction, then either sell out or refund</title><rect width="980" height="205" rx="12" fill="#1f1f1f"/><defs><marker id="ah989890" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#989890"/></marker><marker id="ah7ed760" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7ed760"/></marker><marker id="ahf6543d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f6543d"/></marker><marker id="ah5fbef5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5fbef5"/></marker></defs><rect x="30" y="40" width="170" height="90" rx="10" fill="#262626" stroke="#7ed760" stroke-width="1.5"/><text x="115" y="75" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#7ed760" text-anchor="middle" font-weight="700">1. Create</text><text x="115" y="100" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#989890" text-anchor="middle" font-weight="400">1 billion tokens</text><text x="115" y="118" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#989890" text-anchor="middle" font-weight="400">fixed supply</text><line x1="200" y1="85" x2="240" y2="85" stroke="#989890" stroke-width="2" marker-end="url(#ah989890)"/><rect x="240" y="40" width="170" height="90" rx="10" fill="#262626" stroke="#7ed760" stroke-width="1.5"/><text x="325" y="75" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#7ed760" text-anchor="middle" font-weight="700">2. Fund</text><text x="325" y="100" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#989890" text-anchor="middle" font-weight="400">500M to sell</text><text x="325" y="118" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#989890" text-anchor="middle" font-weight="400">500M held back</text><line x1="410" y1="85" x2="450" y2="85" stroke="#989890" stroke-width="2" marker-end="url(#ah989890)"/><rect x="450" y="40" width="170" height="90" rx="10" fill="#262626" stroke="#7ed760" stroke-width="1.5"/><text x="535" y="75" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#7ed760" text-anchor="middle" font-weight="700">3. Auction</text><text x="535" y="100" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#989890" text-anchor="middle" font-weight="400">buy in batches</text><text x="535" y="118" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#989890" text-anchor="middle" font-weight="400">1 to 30 days</text><path d="M620,70 C660,70 660,50 700,50" stroke="#7ed760" stroke-width="2" fill="none" marker-end="url(#ah7ed760)"/><path d="M620,100 C660,100 660,150 700,150" stroke="#f6543d" stroke-width="2" fill="none" marker-end="url(#ahf6543d)"/><rect x="700" y="15" width="250" height="75" rx="10" fill="#22301d" stroke="#7ed760" stroke-width="1.5"/><text x="825" y="43" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#7ed760" text-anchor="middle" font-weight="700">Sells out</text><text x="825" y="65" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#d6d6d0" text-anchor="middle" font-weight="400">pool opens, claims open</text><text x="825" y="81" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#989890" text-anchor="middle" font-weight="400">in the same transaction</text><rect x="700" y="115" width="250" height="75" rx="10" fill="#331f1c" stroke="#f6543d" stroke-width="1.5"/><text x="825" y="143" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#f6543d" text-anchor="middle" font-weight="700">Deadline passes</text><text x="825" y="165" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#d6d6d0" text-anchor="middle" font-weight="400">everyone takes back</text><text x="825" y="181" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#989890" text-anchor="middle" font-weight="400">exactly what they paid</text></svg>